<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════════
 ROXIQ — Certificate Verification v11 "MAHARAJA VAULT"
═══════════════════════════════════════════════════════════════════
 DESIGN: deep royal navy stage + gold spotlight, BOLD typography,
 CLEAN layout (clutter-free). Doors: giant concentric VAULT RINGS
 (dono doors ke half-rings seam pe milkar full circle banate hain),
 gold seam light leak, ornate 170px medallion.
 Cert: rich navy glass card, gold foil title, BADA gold naam,
 photo ring + crown + laurel, medal, seal. Tilt+glare+burst bachi hai.
 Perf: sab animations transform/opacity only.
═══════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#080403">
<title>ROXIQ — Verify Certificate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{min-height:100vh;min-height:100dvh;
  background:radial-gradient(ellipse at 50% -12%,#221410 0%,#150c09 42%,#080403 100%);
  color:#f0e4d8;font-family:'Cormorant Garamond',Georgia,serif;
  display:flex;align-items:center;justify-content:center;position:relative;
  overflow:hidden;overscroll-behavior:none;padding:26px 14px;
  -webkit-user-select:none;user-select:none;}

/* ═══ BACKGROUND — royal stage ═══ */
.rings{position:fixed;inset:-50%;pointer-events:none;opacity:.35;
  background:repeating-radial-gradient(circle at 50% 50%,
    transparent 0 70px,rgba(205,139,87,.07) 70px 71px);}
.vig{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse at 50% 40%,transparent 46%,rgba(0,0,0,.5) 100%);}

/* ═══ SINGLE CENTERED COLUMN ═══ */
.inner{position:relative;z-index:10;width:100%;max-width:480px;text-align:center;}
.urlbar{display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;letter-spacing:1.5px;color:#cfb8a8;margin-bottom:18px;
  font-style:italic;padding:7px 18px;border:1px solid rgba(205,139,87,.3);
  border-radius:99px;background:rgba(18,12,9,.7);max-width:94%;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;}
.urlbar b{color:#cd8b57;font-style:normal;font-weight:600;letter-spacing:1px;}

/* ═══ 1 — SCANNER ═══ */
.hudbox{position:relative;padding:40px 24px 30px;border-radius:16px;
  background:linear-gradient(170deg,rgba(20,28,52,.94),rgba(10,15,30,.95));
  border:1px solid rgba(205,139,87,.35);
  box-shadow:0 30px 70px -20px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.05);}
.hud-c{position:absolute;width:20px;height:20px;border:1.5px solid #cd8b57;
  filter:drop-shadow(0 0 5px rgba(205,139,87,.45));}
.hud-tl{top:9px;left:9px;border-right:none;border-bottom:none;border-radius:6px 0 0 0;}
.hud-tr{top:9px;right:9px;border-left:none;border-bottom:none;border-radius:0 6px 0 0;}
.hud-bl{bottom:9px;left:9px;border-right:none;border-top:none;border-radius:0 0 0 6px;}
.hud-br{bottom:9px;right:9px;border-left:none;border-top:none;border-radius:0 0 6px 0;}
.scanring{width:94px;height:94px;margin:0 auto 10px;position:relative;}
.scanring .r1{position:absolute;inset:0;border:1.5px dashed rgba(205,139,87,.55);
  border-radius:50%;animation:spin 7s linear infinite;}
.scanring .r2{position:absolute;inset:11px;border:1.5px solid rgba(233,226,207,.18);
  border-top-color:#f0e4d8;border-radius:50%;animation:spin 10s linear infinite reverse;}
.scanring .r3{position:absolute;inset:23px;border:1px solid rgba(205,139,87,.22);
  border-bottom-color:#cd8b57;border-radius:50%;animation:spin 4.5s linear infinite;}
.scanring .core{position:absolute;inset:30px;display:flex;align-items:center;
  justify-content:center;border-radius:50%;
  background:radial-gradient(circle,#1d130d,#0e0806);
  box-shadow:inset 0 0 12px rgba(205,139,87,.14),0 0 20px rgba(0,0,0,.7);}
.scanring .core svg{width:22px;height:22px;animation:qrPulse 1.6s ease-in-out infinite;}
@keyframes qrPulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.pct{font-family:'Cinzel',serif;font-size:26px;font-weight:700;color:#cd8b57;
  letter-spacing:2px;margin-bottom:2px;}
.pct small{font-size:12px;color:#9c6a42;}
.hdr{font-family:'Cinzel',serif;font-size:13px;font-weight:700;
  letter-spacing:5px;color:#f0e4d8;margin:16px 0 5px;}
.hdr-sub{font-size:10px;letter-spacing:4px;color:#a08a78;font-weight:600;margin-bottom:18px;}
.idpill{display:inline-block;font-family:'Courier New',monospace;font-size:13px;
  line-height:1.5;color:#e9c3a0;padding:11px 18px;max-width:100%;word-break:break-all;
  background:rgba(205,139,87,.07);border:1px solid rgba(205,139,87,.32);border-radius:8px;}
.pbar{height:3px;background:#231811;border-radius:99px;overflow:hidden;margin-top:20px;
  position:relative;}
.pbar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#9c6a42,#cd8b57,#e9c3a0);
  animation:fill 2.2s ease-out forwards;}
.pbar::after{content:'';position:absolute;top:0;bottom:0;width:26px;
  background:linear-gradient(90deg,transparent,rgba(238,200,168,.6),transparent);
  animation:scanGlow 1.2s linear infinite;}
@keyframes scanGlow{from{left:-30px}to{left:100%}}
@keyframes fill{to{width:100%}}
.gcheck{width:72px;height:72px;margin:0 auto 16px;animation:okGlow 2s ease-in-out infinite;}
@keyframes okGlow{0%,100%{filter:drop-shadow(0 0 5px rgba(205,139,87,.4))}
  50%{filter:drop-shadow(0 0 18px rgba(205,139,87,.85))}}
.gcheck circle{stroke-dasharray:340;stroke-dashoffset:340;animation:draw .6s ease-out forwards;}
.gcheck path{stroke-dasharray:80;stroke-dashoffset:80;animation:draw .4s .55s ease-out forwards;}
@keyframes draw{to{stroke-dashoffset:0}}
.gtxt{font-family:'Cinzel',serif;font-size:16px;font-weight:700;
  letter-spacing:3.5px;color:#cd8b57;opacity:0;animation:fadeUp .5s .25s ease-out forwards;}
.gsub{font-size:11.5px;letter-spacing:3.5px;color:#ae9887;font-weight:500;
  margin-top:8px;opacity:0;animation:fadeUp .5s .4s ease-out forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ═══ 2 — VAULT DOORS ═══ */
.doorlayer{position:fixed;inset:0;z-index:40;visibility:hidden;pointer-events:none;
  overflow:hidden;perspective:1500px;}
.doorlayer.show{visibility:visible;}
/* half-rings har door par — seam pe milkar GIANT VAULT RING */
.door{position:absolute;top:0;bottom:0;width:50.5%;}
.door-l{left:0;transform-origin:left center;
  background:
    repeating-radial-gradient(circle at 100% 50%,
      rgba(205,139,87,.10) 0 1.5px,transparent 1.5px 24px),
    linear-gradient(100deg,rgba(255,255,255,.035),transparent 30%),
    linear-gradient(180deg,#221812 0%,#140c09 55%,#1f140f 100%);}
.door-r{right:0;transform-origin:right center;
  background:
    repeating-radial-gradient(circle at 0% 50%,
      rgba(205,139,87,.10) 0 1.5px,transparent 1.5px 24px),
    linear-gradient(260deg,rgba(255,255,255,.035),transparent 30%),
    linear-gradient(180deg,#221812 0%,#140c09 55%,#1f140f 100%);}
/* gold seam edge */
.door-l{border-right:2px solid #cd8b57;
  box-shadow:inset -16px 0 40px -12px rgba(205,139,87,.35);}
.door-r{border-left:2px solid #cd8b57;
  box-shadow:inset 16px 0 40px -12px rgba(205,139,87,.35);}
/* ornate gold frame */
.dframe{position:absolute;top:16px;bottom:16px;left:22px;right:22px;
  border:1.5px solid rgba(205,139,87,.55);border-radius:6px;}
.dframe::before{content:'';position:absolute;inset:6px;
  border:1px solid rgba(205,139,87,.22);border-radius:4px;}
.ddia{position:absolute;width:7px;height:7px;background:#cd8b57;
  transform:rotate(45deg);box-shadow:0 0 9px rgba(205,139,87,.8);}
.ddia.tl{top:-3.5px;left:-3.5px}.ddia.tr{top:-3.5px;right:-3.5px}
.ddia.bl{bottom:-3.5px;left:-3.5px}.ddia.br{bottom:-3.5px;right:-3.5px}
/* seam se gold light leak */
.seamlight{position:absolute;left:50%;top:0;bottom:0;width:3px;z-index:41;
  transform:translateX(-50%);
  background:linear-gradient(180deg,transparent,rgba(238,200,168,.95) 28%,rgba(238,200,168,.95) 72%,transparent);
  filter:drop-shadow(0 0 12px rgba(205,139,87,.9));
  opacity:0;animation:seamPulse 1.6s ease-in-out infinite;}
@keyframes seamPulse{0%,100%{opacity:.3}50%{opacity:.85}}
.doorlayer.locked .seamlight{display:none;}
.doorlayer.open .seamlight{animation:seamFade .4s ease-out forwards;}
@keyframes seamFade{to{opacity:0}}
.door .shade{position:absolute;inset:0;background:#000;opacity:0;}
.doorlayer.open .door .shade{animation:shadeIn 1.7s ease forwards;}
@keyframes shadeIn{35%{opacity:0}100%{opacity:.55}}
.doorlayer.open .door-l{animation:swingL 1.7s cubic-bezier(.62,.02,.22,1) forwards;}
.doorlayer.open .door-r{animation:swingR 1.7s cubic-bezier(.62,.02,.22,1) forwards;}
@keyframes swingL{to{transform:rotateY(-103deg)}}
@keyframes swingR{to{transform:rotateY(103deg)}}
.doorlayer.locked .door{border-color:#c0505a;}
.doorlayer.locked .door-l{box-shadow:inset -16px 0 40px -12px rgba(192,80,90,.35);}
.doorlayer.locked .door-r{box-shadow:inset 16px 0 40px -12px rgba(192,80,90,.35);}
.doorlayer.locked .dframe{border-color:rgba(192,80,90,.55);}
.doorlayer.locked .ddia{background:#c0505a;box-shadow:0 0 9px rgba(192,80,90,.8);}
.doorlayer.locked{animation:shakeHard .55s 1.1s both;}
@keyframes shakeHard{10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}
  40%,60%{transform:translateX(8px)}}

/* ORNATE MEDALLION */
.emblem{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:170px;height:170px;border-radius:50%;z-index:42;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:radial-gradient(circle,#241912 28%,#0e0806 80%);
  border:2.5px solid #cd8b57;
  box-shadow:0 0 55px rgba(205,139,87,.45),
             inset 0 0 34px rgba(205,139,87,.14),
             0 0 0 8px rgba(205,139,87,.07);
  animation:embPulse 2s ease-in-out infinite;}
.emblem::before{content:'';position:absolute;inset:9px;border-radius:50%;
  border:1px solid rgba(205,139,87,.5);}
.emblem::after{content:'';position:absolute;inset:16px;border-radius:50%;
  border:1.5px dashed rgba(205,139,87,.35);animation:spin 18s linear infinite;}
@keyframes embPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.03)}}
.emblem .mono{font-family:'Cinzel',serif;font-weight:900;font-size:68px;line-height:1;
  color:transparent;
  background:linear-gradient(170deg,#f2d4b8 10%,#cd8b57 55%,#7a5533 100%);
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 13px rgba(205,139,87,.45));}
.emblem .e1{font-family:'Cinzel',serif;font-size:12px;font-weight:700;letter-spacing:6px;color:#cd8b57;}
.emblem .e2{font-size:9.5px;letter-spacing:4px;color:#a08568;font-style:italic;}
.emblem .ed{position:absolute;width:8px;height:8px;background:#cd8b57;
  transform:rotate(45deg);box-shadow:0 0 10px rgba(205,139,87,.9);z-index:43;}
.emblem .ed.l{left:-14px;top:50%;margin-top:-4px;}
.emblem .ed.r{right:-14px;top:50%;margin-top:-4px;}
.emblem .ed.t{top:-14px;left:50%;margin-left:-4px;}
.emblem .ed.b{bottom:-14px;left:50%;margin-left:-4px;}
.doorlayer.open .emblem{animation:embFade .55s ease-out forwards;}
@keyframes embFade{to{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
.doorlayer.locked .emblem{border-color:#c0505a;
  box-shadow:0 0 55px rgba(192,80,90,.45),inset 0 0 34px rgba(192,80,90,.14);}
.doorlayer.locked .emblem .mono{
  background:linear-gradient(170deg,#e8a8b0 10%,#c0505a 55%,#7a2a32 100%);
  -webkit-background-clip:text;background-clip:text;}
.doorlayer.locked .emblem .e1{color:#c0505a;}
.doorlayer.locked .emblem .e2{color:#9a6a70;}
.doorlayer.locked .emblem .ed{background:#c0505a;box-shadow:0 0 10px rgba(192,80,90,.9);}

/* light burst + pool */
.doorlight{position:absolute;left:50%;top:-12%;height:124%;width:240px;
  transform:translateX(-50%) scaleX(0);
  background:radial-gradient(ellipse at center,
    rgba(255,244,200,.95) 0%,rgba(238,200,168,.45) 35%,transparent 72%);opacity:0;}
.doorlayer.open .doorlight{animation:lightBurst 1.8s ease-out forwards;}
@keyframes lightBurst{0%{opacity:0;transform:translateX(-50%) scaleX(.05)}
  24%{opacity:1}100%{opacity:0;transform:translateX(-50%) scaleX(1)}}
.pool{position:absolute;bottom:0;left:0;right:0;height:120px;opacity:0;
  background:radial-gradient(ellipse at 50% 100%,rgba(238,200,168,.22),transparent 70%);}
.doorlayer.open .pool{animation:poolIn 1.4s .35s ease-out forwards;}
@keyframes poolIn{to{opacity:1}}
.flash{position:absolute;inset:0;
  background:radial-gradient(ellipse at center,rgba(255,242,205,.85),transparent 62%);
  opacity:0;}
.doorlayer.open .flash{animation:flashOut .95s .3s ease-out forwards;}
@keyframes flashOut{0%{opacity:0}16%{opacity:1}100%{opacity:0}}

/* god rays + motes */
.rays{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;
  transition:opacity 1.6s ease;overflow:hidden;}
.rays.show{opacity:1;}
.ray{position:absolute;top:-25%;height:150%;width:100px;
  background:linear-gradient(180deg,rgba(238,200,168,.22),rgba(238,200,168,.04) 55%,transparent 80%);
  transform-origin:top center;
  animation:raySway 7s ease-in-out infinite alternate;}
.ray.r1{left:8%;transform:rotate(20deg);width:80px;}
.ray.r2{left:26%;transform:rotate(9deg);animation-delay:.8s;}
.ray.r3{left:44%;transform:rotate(-3deg);width:140px;animation-delay:1.6s;}
.ray.r4{left:62%;transform:rotate(-10deg);animation-delay:.4s;}
.ray.r5{left:80%;transform:rotate(-22deg);width:80px;animation-delay:2s;}
@keyframes raySway{from{opacity:.5}to{opacity:1}}
.mote{position:absolute;width:3px;height:3px;border-radius:50%;background:#e9c3a0;
  opacity:0;animation:moteFloat 6s ease-in-out infinite;box-shadow:0 0 5px #cd8b57;}
@keyframes moteFloat{0%{opacity:0;transform:translateY(24px)}
  30%{opacity:.8}100%{opacity:0;transform:translateY(-80px)}}

/* ═══ 3 — ROYAL CERTIFICATE CARD (clean) ═══ */
.certwrap{perspective:1200px;display:none;position:relative;z-index:10;}
.certwrap.reveal{display:block;}
.tiltwrap{position:relative;z-index:10;}
.tilt{transform-style:preserve-3d;transition:transform .15s ease-out;will-change:transform;}
.glare{position:absolute;inset:0;border-radius:16px;pointer-events:none;z-index:5;
  background:linear-gradient(105deg,transparent 30%,rgba(255,242,200,.14) 50%,transparent 70%);
  background-size:220% 100%;}
.aura{position:absolute;left:50%;top:48%;width:150%;height:118%;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center,rgba(205,139,87,.22),rgba(205,139,87,.07) 45%,transparent 70%);
  pointer-events:none;filter:blur(12px);z-index:-1;
  animation:auraPulse 4.6s ease-in-out infinite;}
@keyframes auraPulse{0%,100%{opacity:.75}50%{opacity:1}}
.card{position:relative;border-radius:16px;padding:44px 24px 26px;
  background:
    radial-gradient(ellipse at 50% -8%,rgba(205,139,87,.15),transparent 52%),
    radial-gradient(circle at 10% 90%,rgba(205,139,87,.05),transparent 40%),
    linear-gradient(170deg,#211511 0%,#140c09 50%,#1d130e 100%);
  transform-style:preserve-3d;opacity:0;
  box-shadow:0 40px 80px -22px rgba(0,0,0,.95),
             0 0 60px -10px rgba(205,139,87,.25),
             inset 0 1px 0 rgba(255,255,255,.06);
  animation:cardEnter 1.25s cubic-bezier(.2,.9,.3,1.04) forwards;}
@keyframes cardEnter{
  0%{opacity:0;transform:rotateY(28deg) rotateX(6deg) scale(.55) translateY(70px)}
  100%{opacity:1;transform:rotateY(0) rotateX(0) scale(1) translateY(0)}}
/* gold foil double border */
.card::before{content:'';position:absolute;inset:0;border-radius:16px;padding:2px;
  background:linear-gradient(155deg,#9c6a42 0%,#e9c3a0 30%,#9c6a42 55%,#cd8b57 80%,#7a5533 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;z-index:2;}
.card::after{content:'';position:absolute;inset:9px;border-radius:11px;
  border:1px solid rgba(205,139,87,.18);pointer-events:none;z-index:2;}
.stamp{position:absolute;top:22px;right:20px;z-index:4;
  padding:6px 13px;border:2.5px solid #2ee583;color:#2ee583;border-radius:6px;
  font-family:'Cinzel',serif;font-size:11px;font-weight:700;letter-spacing:2.5px;
  box-shadow:inset 0 0 0 1.5px rgba(46,229,131,.3);
  transform:rotate(-10deg);opacity:0;
  animation:stampIn .3s 2.4s cubic-bezier(.2,2.2,.4,1) forwards,
            stampGlow 2.8s 2.9s ease-in-out infinite;}
@keyframes stampIn{from{transform:rotate(-10deg) scale(2.6);opacity:0}
  to{transform:rotate(-10deg) scale(1);opacity:.95}}
@keyframes stampGlow{0%,100%{opacity:.95}50%{opacity:.75}}

.cert-title{font-family:'Cinzel',Georgia,serif;font-weight:900;font-size:23px;
  letter-spacing:7px;line-height:1.1;
  background:linear-gradient(100deg,#7a5533 0%,#f2d4b8 30%,#cd8b57 50%,#f2d4b8 70%,#7a5533 100%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 8px rgba(205,139,87,.35));
  opacity:0;animation:fadeUp .55s .3s ease-out forwards,goldSweep 5.2s 2.4s ease-in-out infinite;}
@keyframes goldSweep{0%{background-position:130% 0}55%,100%{background-position:-130% 0}}
.cert-subtitle{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:13px;
  letter-spacing:7px;color:#cfb8a8;margin-top:6px;
  opacity:0;animation:fadeUp .55s .4s ease-out forwards;}
.card-orna{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:10px;
  opacity:0;animation:fadeUp .5s .48s ease-out forwards;}
.card-orna::before,.card-orna::after{content:'';height:1px;width:64px;
  background:linear-gradient(90deg,transparent,#9c6a42);}
.card-orna::after{background:linear-gradient(90deg,#9c6a42,transparent);}
.card-orna i{width:5px;height:5px;background:#cd8b57;transform:rotate(45deg);
  box-shadow:0 0 7px rgba(205,139,87,.7);}
.card-hdr2{font-family:'Cinzel',serif;font-size:10.5px;font-weight:600;
  letter-spacing:5px;color:#ae9887;margin-top:8px;
  opacity:0;animation:fadeUp .5s .56s ease-out forwards;}

.photowrap{position:relative;width:116px;height:116px;margin:22px auto 4px;
  opacity:0;animation:photoIn .8s .55s cubic-bezier(.2,1.5,.35,1) forwards;}
@keyframes photoIn{from{opacity:0;transform:scale(.25) rotate(-12deg)}
  to{opacity:1;transform:scale(1) rotate(0)}}
.photowrap .laur{position:absolute;width:146px;height:166px;top:-13px;left:-15px;
  pointer-events:none;opacity:.8;}
.crown{position:absolute;top:-20px;left:50%;transform:translateX(-50%) rotate(-8deg);
  z-index:3;filter:drop-shadow(0 0 8px rgba(205,139,87,.6));
  animation:crownFloat 3.4s ease-in-out infinite;}
@keyframes crownFloat{0%,100%{transform:translateX(-50%) rotate(-8deg) translateY(0)}
  50%{transform:translateX(-50%) rotate(-8deg) translateY(-4px)}}
.phring{position:absolute;inset:12px;border-radius:50%;padding:3px;
  background:linear-gradient(140deg,#e9c3a0,#9c6a42 45%,#cd8b57 90%);
  box-shadow:0 0 30px rgba(205,139,87,.4),0 8px 18px rgba(0,0,0,.5);}
.phring::before{content:'';position:absolute;inset:-6px;border-radius:50%;
  border:1.5px dashed rgba(205,139,87,.45);animation:spin 16s linear infinite;}
.phring .ph{width:100%;height:100%;border-radius:50%;overflow:hidden;
  background:#120b08;border:2px solid #231811;display:flex;
  align-items:center;justify-content:center;}
.phring img{width:100%;height:100%;object-fit:cover;}
.gem{position:absolute;width:6px;height:6px;border-radius:50%;z-index:3;
  background:radial-gradient(circle at 35% 30%,#f2d4b8,#cd8b57 60%,#7a5533);
  box-shadow:0 0 7px rgba(205,139,87,.85);
  animation:gemTw 2.8s ease-in-out infinite;}
@keyframes gemTw{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}

   Paste these 6 values EXACTLY from roxiq-app/.env (the
   VITE_FIREBASE_* keys). They are not secret — every Firebase web
   app ships them in its own bundle — what actually protects this
   data is firestore.rules: the `certificates` collection only ever
   accepts writes from an admin session; this page only ever reads. */
const firebaseConfig = {
  apiKey: "REPLACE_WITH_VITE_FIREBASE_API_KEY",
  authDomain: "REPLACE_WITH_VITE_FIREBASE_AUTH_DOMAIN",
  projectId: "REPLACE_WITH_VITE_FIREBASE_PROJECT_ID",
  storageBucket: "REPLACE_WITH_VITE_FIREBASE_STORAGE_BUCKET",
  messagingSenderId: "REPLACE_WITH_VITE_FIREBASE_MESSAGING_SENDER_ID",
  appId: "REPLACE_WITH_VITE_FIREBASE_APP_ID",
};
firebase.initializeApp(firebaseConfig);
const firestoreDb = firebase.firestore();

/* ══ certId comes straight out of the URL ══
   This file lives in the "roxiq1" Vercel project (roxiq.in) at
   public/verify.html, with a rewrite in that project's vercel.json
   sending /verify/* here — so whatever the visitor's browser shows
   after "/verify/" IS the certId, the same ID that's printed and
   QR-coded on the physical certificate. Nothing to parse from a
   query string. */
function getCertIdFromUrl() {
  const parts = location.pathname.split('/').filter(Boolean);
  const i = parts.indexOf('verify');
  return i >= 0 && parts[i + 1] ? decodeURIComponent(parts[i + 1]) : '';
}

// DEMO holds whichever certificate is currently being shown — filled
// in by fetchAndRender() below. TRIED_ID is whatever ID was actually
// looked up, valid or not, so the "not found" screen can show it.
let DEMO = null;
let TRIED_ID = '';

async function fetchCertificate(certId) {
  const snap = await firestoreDb.collection('certificates').doc(certId).get();
  if (!snap.exists) return null;
  const c = snap.data();
  // A revoked certificate reads exactly like one that never
  // existed — see certificateActions.js's revokeCertificate().
  if (c.status !== 'issued') return null;
  return c;
}

function toDisplayCert(certId, c) {
  const issuedDate = c.issuedAt && c.issuedAt.toDate ? c.issuedAt.toDate()
    : (c.createdAt && c.createdAt.toDate ? c.createdAt.toDate() : new Date());
  return {
    certId,
    playerName: c.playerName || 'Player',
    state: c.stateName || '',
    round: 'Round ' + c.round + (c.isFinal ? ' · Final' : ''),
    ribbon: c.isFinal ? (c.tier + ' · TRACK CHAMPION') : (c.tier + ' TIER QUALIFIER'),
    track: (c.track || '').toUpperCase(),
    rank: c.rank != null ? c.rank : '—',
    dateIssued: issuedDate.toLocaleDateString('en-IN'),
    photo: null,
  };
}

        <circle cx="60" cy="60" r="53" stroke="#c0505a" stroke-width="3"/>
        <line x1="42" y1="42" x2="78" y2="78" stroke="#c0505a" stroke-width="7" stroke-linecap="round"/>
        <line x1="78" y1="42" x2="42" y2="78" stroke="#c0505a" stroke-width="7" stroke-linecap="round"/>
      </svg>
      <div class="gtxt" style="color:#d4676f">VERIFICATION FAILED</div>
      <div class="gsub" style="color:#9a7078">RECORD NOT FOUND IN ROXIQ DATABASE</div>
    </div>`;
}

function renderCert(){
  const d = DEMO;
  const gems = GEMS.map(([l,t]) =>
    `<span class="gem" style="left:${l};top:${t}"></span>`).join('');
  const rows = [
    ['PLAYER', d.playerName, ''],
    ['STATE', d.state, ''],
    ['ROUND', d.round, 'gold'],
    ['TRACK', d.track + ' TRACK', 'gold'],
    ['RANK', '#' + d.rank, 'green'],
    ['ISSUE DATE', d.dateIssued, ''],
  ].map(([k,v,c]) =>
    `<div class="row"><span class="k">${k}</span><span class="v ${c}">${v}</span></div>`).join('');
  const photo = d.photo ? `<img src="${d.photo}" alt="">` : PHOTO_SVG;
  $cert.innerHTML = `
    <div class="burstring"></div>
    <div class="burstring" style="animation-delay:.18s"></div>
    ${burstParts}
    <div class="aura"></div>
    <div class="tiltwrap" id="tiltwrap">
    <div class="tilt" id="tilt">
    <div class="card">
      <div class="stamp">VERIFIED</div>
      <div class="cert-title">CERTIFICATE</div>
      <div class="cert-subtitle">OF QUALIFICATION</div>
      <div class="card-orna"><i></i></div>
      <div class="card-hdr2">FREE FIRE STATE CHAMPIONSHIP 2026</div>
      <div class="photowrap">
        <span class="crown">${CROWN_SVG}</span>
        <span class="laur">${LAUREL_SVG}</span>
        <div class="phring">
          ${gems}
          <div class="ph">${photo}</div>
        </div>
      </div>
      <div class="ribbonwrap"><span class="ribbon">${d.ribbon}</span></div>
      <div class="name">${d.playerName}</div>
      <div class="name-orna"><i></i></div>
      <div class="tag">has successfully qualified for the<br><b>${d.round}</b></div>
      <div class="medalwrap">
        <span class="rib l"></span><span class="rib r"></span>
        <div class="medal"><span class="mk">RANK</span><span class="mv">#${d.rank}</span></div>
      </div>
      <div class="rows">${rows}</div>
      <div class="sealwrap">${SEAL_SVG}</div>
      <div class="barcode"></div>
      <div class="cfoot">
        <span class="ok">✓</span> Authenticated by ROXIQ Championship Cell<br>
        Certificate ID: <span class="gold">${d.certId}</span><br>
        Verified: ${new Date().toLocaleString('en-IN')}
      </div>
    </div>
    <div class="glare" id="glare"></div>
    </div>
    </div>`;
  bindTilt();
}

function renderDenied(){
  setUrl(TRIED_ID);
  $denied.innerHTML = `
    <div class="dxt">ACCESS DENIED</div>
    <div class="dsub">Checked ID: <b>${TRIED_ID}</b></div>
    <div class="dwarn">
      This certificate ID was <b>not found in ROXIQ records.</b><br>
      The certificate may be <b>fake, altered or expired.</b><br><br>
      Report suspected fakes: <b>support@roxiq.in</b>
    </div>`;
}

/* ══ SEQUENCES ══ */
function playVerified(){
  reset();
  renderScan(TRIED_ID);
  wait(2300, () => renderGranted(true));
  wait(3150, () => $doors.classList.add('show'));
  wait(3300, () => { $scan.innerHTML = ''; renderCert(); });
  wait(4050, () => { $doors.classList.add('open'); $rays.classList.add('show');
                     $cert.classList.add('reveal'); });
  wait(6300, () => $ctrl.classList.remove('hidden'));
}

function playInvalid(){
  reset();
  renderScan(TRIED_ID);
  wait(2300, () => renderGranted(false));
  wait(3150, () => $doors.classList.add('show','locked'));
  wait(3400, () => { $scan.innerHTML = ''; renderDenied(); });
  wait(4200, () => $denied.classList.add('show'));
  wait(5100, () => $ctrl.classList.remove('hidden'));
}

/* ══ REAL ENTRY POINT ══
   Runs on load and again on "RE-VERIFY". Looks up whatever certId is
   in the URL and only plays the vault-opening sequence if a genuine,
   issued certificate exists for it — otherwise it plays the denied
   sequence with the actual ID that was checked. */
async function boot(){
  TRIED_ID = getCertIdFromUrl();
  if (!TRIED_ID) { playInvalid(); return; }
  try {
    const c = await fetchCertificate(TRIED_ID);
    if (!c) { playInvalid(); return; }
    DEMO = toDisplayCert(TRIED_ID, c);
    playVerified();
  } catch (err) {
    console.error('Certificate lookup failed:', err);
    playInvalid();
  }
}

boot();
</script>
